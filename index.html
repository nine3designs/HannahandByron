<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Meow+Script&family=Young+Serif&display=swap" rel="stylesheet">
<link href="https://db.onlinewebfonts.com/c/9366bd460113d8bf675fd2bdfe1ce764?family=The+Seasons" rel="stylesheet" type="text/css"/>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hannah &amp; Byron — Save the Date</title>
<link rel="icon" href="images/heart.ico" type="image/x-icon">

     
<meta name="description" content="Hannah and Byron are getting married 28.05.27 at The Glass House, Staining. Full details coming soon.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="paper-grain"></div>
<!-- =========================================================
     INTRO ENVELOPE ANIMATION
     ========================================================= -->
<div id="intro-envelope" class="intro-envelope" aria-label="Open invitation">

  <div class="intro-envelope__scene">

    <div class="intro-envelope__card">
      <span class="intro-envelope__card-small">Save the Date</span>
      <strong>Hannah</strong>
      <span class="intro-envelope__and">&amp;</span>
      <strong>Byron</strong>

    </div>

    <div class="intro-envelope__body"></div>

    <div class="intro-envelope__flap"></div>

    <button
      type="button"
      id="intro-seal"
      class="intro-envelope__seal"
      aria-label="Open invitation"
    >
      <span>H&amp;B</span>
    </button>

  </div>

  <p class="intro-envelope__instruction">
    Tap the seal to open
  </p>

</div>

<main class="landing">
  <div class="invite-stage">

    <img class="spray-img spray-img--left" src="images/floral1.png" alt="" aria-hidden="true">
    <img class="spray-img spray-img--right" src="images/floral2.png" alt="" aria-hidden="true">

    <div class="frame">
      <p class="eyebrow">Save the Date</p>

      <div class="divider" aria-hidden="true">
        <span class="glyph">&#9825;</span>
      </div>

      <h1 class="names" style="margin:0.6em 0 0;">Hannah</h1>
      <span class="amp">and</span>
      <h1 class="names" style="margin:0;">Byron</h1>

      <p class="date-line">28 . 05 . 27</p>

      <div class="divider" aria-hidden="true">
        <span class="rule"></span><span class="glyph">&#9825;</span><span class="rule"></span>
      </div>

    <p class="venue">The Glass House,<br>Staining</p>
    </div>

  </div>

  <div class="teaser">
    <p>INVITATIONS TO FOLLOW.</p>
    <button id="seal-trigger" class="seal-trigger" aria-haspopup="dialog">
      <span class="seal">H&amp;B</span>
      Guests, click here
    </button>
  </div>

</main>

<!-- ===== Envelope password gate ===== -->
<div id="lock-overlay" class="lock-overlay" aria-hidden="true">
  <div id="envelope" class="envelope" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <button id="lock-close" class="lock-close" aria-label="Close">&times;</button>
    <div class="envelope-flap"></div>
    <div class="envelope-back"></div>
    <div class="envelope-card">
      <p class="eyebrow">A little early, are we?</p>
      <h2 id="lock-title">Enter the word from your invitation</h2>
      <form id="lock-form" novalidate>
        <input type="password" id="lock-password" name="password" placeholder="Password" autocomplete="off" required>
        <button type="submit" class="btn btn--filled">Unlock our site</button>
      </form>
      <p id="lock-error" class="lock-error" role="alert" hidden>That's not quite right — check your invite and try again.</p>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/intro.js"></script>
<script src="js/lock.js"></script>
</body>
</html>
